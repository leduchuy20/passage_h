<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oxford 5000 qua đoạn văn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --panel:#fffdf8; --ink:#1d2126; --muted:#6a6f76; --line:#e4ddd0; --soft:#efe9dd;
  --accent:#0d6b63; --accent-ink:#ffffff; --accent-soft:#d9eeea;
  --A1:#2f8a3e; --A2:#0f7f86; --B1:#2f62c4; --B2:#7a45c0; --C1:#c2502a;
  --A1s:#e1f2e2; --A2s:#d9f0f1; --B1s:#e0e9fb; --B2s:#ece2f9; --C1s:#fbe5dc;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 24px rgba(40,30,10,.06);
  --good:#2f8a3e; --good-s:#e1f2e2; --warn:#b7791f; --warn-s:#fbefd5; --bad:#c0392b; --bad-s:#fbe3df;
  --rS:#1f5fbf; --rV:#c0392b; --rO:#1d7a3c; --rC:#7a45c0; --rA:#9a5b12; --rK:#6a6f76;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --panel:#1c1f23; --ink:#e8e6e1; --muted:#9aa0a6; --line:#2c3036; --soft:#23272c;
    --accent:#3fb8aa; --accent-ink:#0c1514; --accent-soft:#183531;
    --A1:#6cc77a; --A2:#4cc3c9; --B1:#7ea6f2; --B2:#b48ef0; --C1:#f08c66;
    --A1s:#1e3323; --A2s:#173437; --B1s:#1b2740; --B2s:#2a2140; --C1s:#3a2219;
    --good:#6cc77a; --good-s:#1e3323; --warn:#e0a948; --warn-s:#3a2e17; --bad:#f07a6a; --bad-s:#3a1f1b;
    --rS:#86adf5; --rV:#f2836f; --rO:#74cf85; --rC:#bb98f2; --rA:#e5b25a; --rK:#9aa0a6;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1c1f23; --ink:#e8e6e1; --muted:#9aa0a6; --line:#2c3036; --soft:#23272c;
  --accent:#3fb8aa; --accent-ink:#0c1514; --accent-soft:#183531;
  --A1:#6cc77a; --A2:#4cc3c9; --B1:#7ea6f2; --B2:#b48ef0; --C1:#f08c66;
  --A1s:#1e3323; --A2s:#173437; --B1s:#1b2740; --B2s:#2a2140; --C1s:#3a2219;
  --good:#6cc77a; --good-s:#1e3323; --warn:#e0a948; --warn-s:#3a2e17; --bad:#f07a6a; --bad-s:#3a1f1b;
  --rS:#86adf5; --rV:#f2836f; --rO:#74cf85; --rC:#bb98f2; --rA:#e5b25a; --rK:#9aa0a6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.2px}
.brand span{color:var(--muted);font-size:12.5px}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;cursor:pointer}
.prog{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}
.bar{flex:1;height:7px;border-radius:9px;background:var(--soft);overflow:hidden;max-width:260px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.prog small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.search{position:relative;width:min(320px,40vw)}
.search input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;padding:8px 12px 8px 32px;font:inherit;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;right:0;top:calc(100% + 6px);width:min(420px,92vw);max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:none;padding:6px}
.results.on{display:block}
.res{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer}
.res:hover,.res.sel{background:var(--soft)}
.res .rw{font-weight:600;min-width:90px}
.res .rm{color:var(--muted);font-size:13px;flex:1}
.res .rp{font-size:12px;color:var(--muted);white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:36px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;max-width:1400px;margin:0 auto}
.side{position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;border-right:1px solid var(--line);padding:14px 12px 40px}
.lvtabs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 4px 12px}
.lvtab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;font-weight:600}
.lvtab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grp{margin:14px 4px 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.item{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:7px 8px;border-radius:10px;cursor:pointer;align-items:start}
.item:hover{background:var(--soft)}
.item.on{background:var(--panel);box-shadow:var(--shadow)}
.item .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;padding-top:1px}
.item .tt{font-size:13.5px;line-height:1.35}
.item .mini{height:3px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}
.item .mini i{display:block;height:100%;background:var(--accent);width:0}

.main{padding:26px 34px 80px;min-width:0}
.reader{max-width:780px;margin:0 auto}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.badge{display:inline-flex;align-items:center;font-weight:700;font-size:11.5px;letter-spacing:.04em;border-radius:6px;padding:2px 7px}
.badge.A1{background:var(--A1s);color:var(--A1)}.badge.A2{background:var(--A2s);color:var(--A2)}.badge.B1{background:var(--B1s);color:var(--B1)}.badge.B2{background:var(--B2s);color:var(--B2)}.badge.C1{background:var(--C1s);color:var(--C1)}
h1.title{font-family:var(--serif);font-weight:600;font-size:clamp(26px,3.4vw,34px);line-height:1.18;letter-spacing:-.4px;margin:10px 0 4px}
.subtitle{color:var(--muted);font-size:15.5px;margin:0 0 18px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.tool{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;font-weight:500}
.tool.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tool svg{flex:none}

.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.text{padding:26px 30px;font-family:var(--serif);font-size:18.5px;line-height:1.78}
.text p{margin:0 0 1em}.text p:last-child{margin-bottom:0}
.w{border-radius:4px;padding:0 2px;margin:0 -2px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:background .15s}
.w.A1{background:var(--A1s)}.w.A2{background:var(--A2s)}.w.B1{background:var(--B1s)}.w.B2{background:var(--B2s)}.w.C1{background:var(--C1s)}
.w.learned{background:transparent;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.nohl .w{background:transparent!important;text-decoration:none}
.w.flash{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.trans{margin-top:14px;padding:20px 26px;font-size:15.5px;line-height:1.7;display:none}
.trans.on{display:block}
.trans h3,.sec h2{margin:0 0 10px}
.trans p{margin:0 0 .8em}

.sec{margin-top:34px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec h2{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.2px}
.sec-head small{color:var(--muted)}
.filters{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.vlist{display:grid;gap:10px}
.v{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.v.done{opacity:.62}
.vh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vw{font-family:var(--serif);font-size:19px;font-weight:600}
.vs{color:var(--muted);font-size:12.5px;font-style:italic}
.vp{color:var(--muted);font-size:12.5px}
.vform{font-size:12.5px;color:var(--muted)}
.vm{grid-column:1/-1;font-size:15px}
.vm .hidden{display:inline-block;background:var(--soft);color:transparent;border-radius:6px;padding:0 8px;cursor:pointer;user-select:none;min-width:120px}
.vm .hidden::after{content:"bấm để xem nghĩa";color:var(--muted);font-size:12.5px}
.vx{grid-column:1/-1;display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.vx b{color:var(--ink);font-weight:600}
.vx .ex{font-family:var(--serif);font-size:14.5px;color:var(--ink);opacity:.9}
.vx .ex b{background:var(--accent-soft);font-weight:600;border-radius:3px;padding:0 2px}
.vx .lab{display:inline-block;min-width:104px;margin-right:8px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.vact{display:flex;gap:6px;align-items:flex-start}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;background:var(--bg);white-space:nowrap}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.spk{border:1px solid var(--line);background:var(--bg);border-radius:999px;width:30px;height:28px;display:grid;place-items:center;cursor:pointer}

.gr{display:grid;gap:10px}
.g{padding:16px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.g b{display:block;font-family:var(--serif);font-size:16.5px;margin-bottom:4px}
.g div{color:var(--ink);opacity:.88;font-size:14.5px}

.nav{display:flex;justify-content:space-between;gap:12px;margin-top:38px}
.nb{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 16px;cursor:pointer;text-align:left}
.nb.r{text-align:right}
.nb small{display:block;color:var(--muted);font-size:12px}
.nb span{font-family:var(--serif);font-size:15.5px}
.nb[disabled]{opacity:.35;cursor:default}

/* popover */
.pop{position:fixed;z-index:50;width:min(340px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.18);padding:14px 16px;display:none}
.pop.on{display:block}
.pop .ph{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pop .pw{font-family:var(--serif);font-size:20px;font-weight:600}
.pop .pm{font-size:15px;margin:2px 0 8px}
.pop .px{font-size:13px;color:var(--muted);display:grid;gap:3px}
.pop .px b{color:var(--ink);font-weight:600}
.pop .pa{display:flex;gap:8px;margin-top:10px}

.intro{padding:22px 26px;margin-bottom:22px;font-size:14.5px}
.intro h2{font-family:var(--serif);margin:0 0 6px;font-size:22px}
.intro ul{margin:8px 0 0;padding-left:18px}
.intro li{margin:3px 0}
.close-intro{float:right;border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px}

/* review button */
.rev-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 5px 4px 11px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;flex:none}
.rev-btn b{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.rev-btn b.zero{background:var(--soft);color:var(--muted)}
.rev-btn.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* modes */
.modes{display:inline-flex;gap:3px;padding:3px;border-radius:12px;background:var(--soft);margin:0 0 18px;flex-wrap:wrap}
.modes button{border:none;background:transparent;border-radius:9px;padding:6px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.modes button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

/* practice (back-translation & dictation) */
.practice{padding:22px 24px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px;font-size:13px;color:var(--muted)}
.prow b{color:var(--ink)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 18px}
.dot{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--bg);font-size:10.5px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-variant-numeric:tabular-nums;padding:0}
.dot.part{background:var(--warn-s);border-color:var(--warn);color:var(--ink)}
.dot.done{background:var(--good-s);border-color:var(--good);color:var(--ink)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.src{font-family:var(--serif);font-size:19px;line-height:1.6;margin:0 0 12px}
.hints{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.hint{border:1px dashed var(--line);border-radius:999px;padding:2px 9px;font-size:12.5px;color:var(--ink);background:var(--bg)}
.hint.used{border-style:solid;border-color:var(--good);background:var(--good-s)}
.ans{display:block;width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55;padding:12px 14px;outline:none}
.ans:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.acts .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:default}
.kbd{font-size:11.5px;color:var(--muted)}
.res-box{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:7px}
.res-box .lbl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.dline{font-family:var(--serif);font-size:17px;line-height:1.75}
.dline mark{background:var(--warn-s);color:inherit;border-bottom:2px solid var(--warn);border-radius:3px;padding:0 2px}
.dline s{color:var(--bad);text-decoration-thickness:2px}
.score{font-weight:700;margin-right:6px}
.score.good{color:var(--good)} .score.mid{color:var(--warn)} .score.low{color:var(--bad)}
.note{font-size:13px;color:var(--muted)}
.ctx{margin-top:14px;font-size:14.5px;line-height:1.7;padding:14px 16px;border-radius:12px;background:var(--soft);display:none}
.ctx.on{display:block}
.ctx .curs{background:var(--accent-soft);border-radius:3px;padding:0 2px}
.play{width:52px;height:52px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.playrow{display:flex;align-items:center;gap:14px;margin:0 0 14px}
.summary{margin-top:18px;padding:18px 22px}
.summary h2{margin:0;font-family:var(--serif);font-size:21px;font-weight:600}
.sumrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.sumrow .num{color:var(--muted);font-variant-numeric:tabular-nums}

/* review */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 12px}
.stat{padding:14px 16px}
.stat b{display:block;font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.fc-wrap{padding:14px 18px 10px}
.fc-wrap > div:first-child{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:110px}
.fc div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11.5px;color:var(--muted)}
.fc i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px;opacity:.85}
.fc em{font-style:normal;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.opt-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px;font-size:13.5px}
.opt-row > span{min-width:118px;color:var(--muted)}
.flash-card{padding:34px 30px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.flash-card hr{border:none;border-top:1px solid var(--line);width:60%;margin:8px auto}
.fw{font-family:var(--serif);font-size:clamp(30px,5vw,42px);font-weight:600;letter-spacing:-.5px;line-height:1.15}
.fmeta{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.fmean{font-size:18px}
.fex{font-family:var(--serif);font-size:16px;opacity:.92;max-width:600px;margin:2px auto 0}
.fex b{background:var(--accent-soft);border-radius:3px;padding:0 2px}
.fex .blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);height:1em;vertical-align:-2px}
.fx{font-size:13.5px;color:var(--muted);display:grid;gap:3px}
.fx b{color:var(--ink);font-weight:600}
.type-in{max-width:340px;margin:6px auto 0;width:100%;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:20px;padding:9px 12px;outline:none}
.type-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.type-in.ok{border-color:var(--good);background:var(--good-s)} .type-in.no{border-color:var(--bad);background:var(--bad-s)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.grade{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:11px 8px;cursor:pointer;font-weight:700;font-size:14.5px}
.grade small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
